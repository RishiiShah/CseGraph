site_name: CseGraph
site_description: Repository context engine for coding agents.
site_url: https://rishiishah.github.io/CseGraph/
repo_name: RishiiShah/CseGraph
repo_url: https://github.com/RishiiShah/CseGraph

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

nav:
  - Overview: index.md
  - Command And SDK Reference: csegraph.md
  - Architecture: architecture.md
  - Agent Context Benchmarks: benchmarks.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences

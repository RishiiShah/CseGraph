version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    labels:
      - github-actions

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    labels:
      - python

  - package-ecosystem: npm
    directory: /csegraph-vscode
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: America/New_York
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: deps
      include: scope

name: Adaptive Retrieval Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  adaptive-nightly:
    name: 60-task adaptive retrieval corpus
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned benchmark dependencies
        run: |
          python -m pip install --upgrade pip -e ".[test,benchmark]"
          npm install --global pyright@1.1.407

      - name: Run the complete nightly corpus
        run: |
          python tools/run_adaptive_retrieval_benchmark.py \
            --corpus nightly \
            --bootstrap-missing \
            --allow-network \
            --modes cold,warm \
            --warm-runs 2 \
            --pyright required \
            --output benchmark_results/adaptive_nightly.json \
            --fail-on-gates

      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adaptive-nightly-benchmark
          path: benchmark_results/adaptive_nightly.json
          if-no-files-found: error

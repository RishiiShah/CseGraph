name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - feature

permissions:
  contents: read

jobs:
  guardrails:
    name: Source layout guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Reject generated artifacts
        run: |
          python - <<'PY'
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_prefixes = (
              ".cursor/",
              ".csegraph/",
              ".gemini/",
              ".kiro/",
              ".scratch/",
              ".vscode/",
              "dist/",
              "build/",
              "csegraph-vscode/node_modules/",
              "csegraph-vscode/out/",
          )
          forbidden_suffixes = (
              ".egg-info/PKG-INFO",
              ".egg-info/SOURCES.txt",
              ".pyc",
              ".pyo",
              ".db",
              ".sqlite",
              ".vsix",
          )
          violations = [
              path
              for path in tracked
              if path.startswith(forbidden_prefixes) or path.endswith(forbidden_suffixes)
          ]
          if violations:
              print("Forbidden tracked files:")
              for path in violations:
                  print(f"  {path}")
              sys.exit(1)
          PY

      - name: Confirm one Python package manifest
        run: |
          python - <<'PY'
          from pathlib import Path

          pyprojects = sorted(
              path.as_posix()
              for path in Path(".").rglob("pyproject.toml")
              if "csegraph-vscode" not in path.as_posix()
              and not path.as_posix().startswith("sandbox/")
          )
          assert pyprojects == ["pyproject.toml"], pyprojects
          assert Path("csegraph/__init__.py").exists()
          assert Path("csegraph/_core/__init__.py").exists()
          assert Path("csegraph/_cli/__init__.py").exists()
          assert Path("csegraph-vscode/package.json").exists()
          PY

  python:
    name: Python 3.13 package and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test/build tooling
        run: python -m pip install --upgrade pip build

      - name: Install csegraph editable
        run: python -m pip install -e ".[test]"

      - name: Verify base install does not require the optional tokenizer
        run: |
          python - <<'PY'
          import importlib.metadata as metadata

          from csegraph._core.retrieval.token_budget import token_measurement

          try:
              metadata.version("tiktoken")
          except metadata.PackageNotFoundError:
              pass
          else:
              raise AssertionError("base test installation unexpectedly installed tiktoken")
          assert token_measurement("o200k_base") == "estimated"
          PY

      - name: Assert single installed distribution and import surface
        run: |
          python - <<'PY'
          import importlib.metadata as metadata

          installed = {dist.metadata["Name"].lower() for dist in metadata.distributions()}
          project_dists = sorted(name for name in installed if name.startswith("csegraph"))
          assert project_dists == ["csegraph"], project_dists
          import csegraph
          from csegraph import ContextService
          assert csegraph.__version__ == "2.0.0"
          assert ContextService is not None
          PY

      - name: Run targeted package and integration tests
        run: |
          python -m pytest \
            tests/integration/test_package_layout.py \
            tests/integration/test_versions.py \
            tests/integration/test_cli.py \
            tests/integration/test_mcp_install.py \
            tests/integration/test_mcp_server.py \
            tests/integration/test_mcp_surface_guardrails.py \
            tests/integration/test_agent_contracts.py \
            tests/integration/test_context_contract.py \
            tests/integration/test_graph_path_contract.py \
            -q

      - name: Compile Python sources
        run: python -m compileall -q csegraph tools csegraph-vscode

      - name: Build and inspect wheel
        run: |
          python -m build
          python - <<'PY'
          from pathlib import Path
          import zipfile

          import tomllib
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          wheels = sorted(Path("dist").glob("csegraph-*.whl"))
          assert len(wheels) == 1, wheels
          assert wheels[0].stat().st_size <= 175 * 1024, wheels[0].stat().st_size
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
          assert any(name.startswith("csegraph/") for name in names)
          assert all(
              name.startswith(("csegraph/", f"csegraph-{version}.dist-info/"))
              for name in names
          )
          PY

  python-compat:
    name: Python compatibility (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.14"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install compatibility test dependencies
        run: python -m pip install --upgrade pip -e ".[test]"

      - name: Run compatibility smoke suite
        run: |
          python -m pytest \
            tests/integration/test_versions.py \
            tests/integration/test_package_layout.py \
            tests/integration/test_migrations.py \
            tests/integration/test_adaptive_context.py \
            tests/integration/test_freshness_concurrency.py \
            tests/integration/test_token_budget_modes.py \
            -q

  mcp-install-smoke:
    name: MCP install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install csegraph editable
        run: python -m pip install --upgrade pip -e ".[test]"

      - name: Run MCP install smoke tests
        run: |
          python -m pytest \
            tests/integration/test_mcp_install.py \
            tests/integration/test_mcp_resolve.py \
            tests/integration/test_install_editor_smoke.py \
            -q

      - name: Exercise installed CLI install and doctor flow
        shell: python
        run: |
          import json
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          cli = shutil.which("csegraph")
          assert cli, "csegraph console script was not found on PATH"

          repo = Path(tempfile.mkdtemp()) / "sample-repo"
          repo.mkdir()
          (repo / "app.py").write_text("def hello():\n    return 'hello'\n", encoding="utf-8")

          install = subprocess.run(
              [cli, "install", str(repo), "--platform", "codex", "--no-verify", "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          install_payload = json.loads(install.stdout)
          assert install_payload["next_steps"]
          assert (repo / ".codex" / "config.toml").exists()

          subprocess.run([cli, "index", str(repo), "--json"], check=True, capture_output=True, text=True)

          doctor = subprocess.run(
              [cli, "doctor", str(repo), "--platform", "codex", "--no-verify", "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          doctor_payload = json.loads(doctor.stdout)
          assert doctor_payload["config_present"] is True
          assert doctor_payload["contract_valid"] is True
          assert doctor_payload["launcher_present"] is True

  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install quality tooling
        run: python -m pip install --upgrade pip -e ".[test,dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy

      - name: Run coverage
        run: |
          python -m coverage run -m pytest tests/ -q
          python -m coverage report

  benchmarks:
    name: Benchmark regression thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip -e ".[test,benchmark]"
          npm install --global pyright@1.1.407

      - name: Run adaptive retrieval PR gates
        run: |
          python tools/run_adaptive_retrieval_benchmark.py \
            --corpus benchmarks/adaptive/pr_tasks.json \
            --modes cold,warm \
            --warm-runs 1 \
            --pyright required \
            --output benchmark_results/adaptive_pr.json \
            --fail-on-gates

      - name: Upload adaptive benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adaptive-pr-benchmark
          path: benchmark_results/adaptive_pr.json
          if-no-files-found: error

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: csegraph-vscode/package-lock.json

      - name: Install extension dependencies
        working-directory: csegraph-vscode
        run: npm ci

      - name: Audit extension dependencies
        working-directory: csegraph-vscode
        run: npm audit --audit-level=high

      - name: Type-check extension
        working-directory: csegraph-vscode
        run: npm run lint

      - name: Compile extension
        working-directory: csegraph-vscode
        run: npm run compile

      - name: Package and inspect VSIX
        working-directory: csegraph-vscode
        run: |
          npm run package
          python - <<'PY'
          from pathlib import Path
          import json
          import zipfile

          version = json.loads(Path("package.json").read_text())["version"]
          vsix = Path(f"csegraph-vscode-{version}.vsix")
          assert vsix.exists()
          with zipfile.ZipFile(vsix) as archive:
              names = archive.namelist()
          assert "extension/out/extension.js" in names
          assert not any(name.startswith("extension/src/") for name in names)
          PY

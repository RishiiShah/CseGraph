[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph"
version = "2.0.1"
description = "Repository context engine for coding agents with CLI, MCP server, and Python facade."
readme = "README.md"
authors = [
    { name = "Rishabh Shah" }, 
    { name = "Hitanshu Oza" }
    ]
license = "MIT"
requires-python = ">=3.10"
keywords = ["code graph", "context", "coding agents", "mcp", "tree-sitter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "mcp>=1.0.0,<3",
    "tiktoken>=0.13,<1",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "setuptools>=68",
    "tomli>=2; python_version < '3.11'",
]
benchmark = ["tiktoken>=0.13,<1"]
dev = [
    "coverage[toml]>=7.6",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/RishiiShah/CseGraph"
Issues = "https://github.com/RishiiShah/CseGraph/issues"
Documentation = "https://github.com/RishiiShah/CseGraph#readme"
Changelog = "https://github.com/RishiiShah/CseGraph/blob/main/CHANGELOG.md"

[project.scripts]
csegraph = "csegraph._cli.main:main"

[tool.setuptools.packages.find]
include = ["csegraph*"]

[tool.setuptools.package-data]
"csegraph" = ["py.typed"]

[tool.pytest.ini_options]
addopts = []
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
markers = [
]

[tool.coverage.run]
branch = true
source = ["csegraph"]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "B",
    "E9",
    "F",
    "I",
]
ignore = ["F841"]

[tool.mypy]
python_version = "3.10"
files = ["csegraph", "tools"]
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
pretty = true

[tool.vulture]
paths = ["csegraph", "tools"]
min_confidence = 80
exclude = ["csegraph/_core/core/models.py"]

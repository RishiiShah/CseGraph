[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph-core"
version = "1.4.0"
description = "Core repository context engine for coding agents. Distribution: csegraph-core; import: csegraph_core."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
embed = ["sentence-transformers>=2.2.0"]
test = ["pytest>=9.0.3"]

[project.urls]
Repository = "https://github.com/RishiiShah/CseGraph"

[tool.setuptools.packages.find]
include = ["csegraph_core*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

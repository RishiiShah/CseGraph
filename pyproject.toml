[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph"
version = "1.1.0"
description = "SQLite-backed code graph indexing and context retrieval for Python repositories."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.0.3"]

[project.scripts]
csegraph = "csegraph.cli:main"

[tool.setuptools]
packages = ["csegraph"]

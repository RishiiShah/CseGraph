[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph-core"
version = "1.4.0"
description = "Core repository context engine for coding agents. Distribution: csegraph-core; import: csegraph_core."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
typescript = [
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
]
go = ["tree-sitter>=0.23", "tree-sitter-go>=0.23"]
rust = ["tree-sitter>=0.23", "tree-sitter-rust>=0.23"]
java = ["tree-sitter>=0.23", "tree-sitter-java>=0.23"]
c = ["tree-sitter>=0.23", "tree-sitter-c>=0.23"]
cpp = ["tree-sitter>=0.23", "tree-sitter-cpp>=0.23"]
ruby = ["tree-sitter>=0.23", "tree-sitter-ruby>=0.23"]
csharp = ["tree-sitter>=0.23", "tree-sitter-c-sharp>=0.23"]
kotlin = ["tree-sitter>=0.23", "tree-sitter-kotlin>=0.23"]
all-languages = [
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-kotlin>=0.23",
]
mcp = ["mcp>=1.0.0"]
test = ["pytest>=9.0.3"]

[project.urls]
Repository = "https://github.com/RishiiShah/CseGraph"

[tool.setuptools.packages.find]
include = ["csegraph_core*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

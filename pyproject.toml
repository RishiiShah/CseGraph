[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph"
version = "1.7.1"
description = "Repository context engine for coding agents with CLI, MCP server, and Python facade."
authors = [{ name = "Rishabh Shah" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "watchfiles>=1.0.0,<2",
    "tomlkit>=0.12.0,<1",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-kotlin>=0.23",
    "tree-sitter-groovy>=0.1.2",
    "tree-sitter-scala>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-swift>=0.7",
    "tree-sitter-lua>=0.2",
    "tree-sitter-zig>=0.1",
    "tree-sitter-powershell>=0.1",
    "tree-sitter-elixir>=0.3",
    "tree-sitter-objc>=0.23",
    "tree-sitter-julia>=0.23",
    "tree-sitter-verilog>=0.23",
    "tree-sitter-fortran>=0.6",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3"]
embeddings = ["sentence-transformers>=1.7.1"]

[project.urls]
Repository = "https://github.com/RishiiShah/CseGraph"
Issues = "https://github.com/RishiiShah/CseGraph/issues"

[project.scripts]
csegraph = "csegraph._cli.main:main"

[tool.setuptools.packages.find]
include = ["csegraph*"]

[tool.setuptools.package-data]
"csegraph._core.graph.templates" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]

[tool.vulture]
paths = ["csegraph", "tools"]
min_confidence = 80
exclude = ["csegraph/_core/core/models.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph-cli"
version = "1.2.2"
description = "Command-line interface for csegraph. Depends on distribution csegraph-core, imported as csegraph_core."
requires-python = ">=3.10"
dependencies = ["csegraph-core>=1.2.2"]

[project.scripts]
csegraph = "csegraph_cli.main:main"

[tool.setuptools.packages.find]
include = ["csegraph_cli*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph-cli"
version = "1.7.1"
description = "JSON-first CLI for csegraph's coding-agent context engine. Depends on csegraph-core, imported as csegraph_core."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["csegraph-core>=1.7.1"]

[project.urls]
Repository = "https://github.com/RishiiShah/CseGraph"
Issues = "https://github.com/RishiiShah/CseGraph/issues"

[project.scripts]
csegraph = "csegraph_cli.main:main"

[tool.setuptools.packages.find]
include = ["csegraph_cli*"]

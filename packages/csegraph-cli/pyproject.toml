[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph-cli"
version = "1.2.1"
description = "Command-line interface for csegraph (talks to csegraph-core directly; codegen is optional via the csegraph SDK)."
requires-python = ">=3.10"
dependencies = ["csegraph-core>=1.2.1"]

[project.scripts]
csegraph = "csegraph_cli.main:main"

[tool.setuptools.packages.find]
include = ["csegraph_cli*"]

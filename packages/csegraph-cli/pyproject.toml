[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph-cli"
version = "1.3.0"
description = "JSON-first CLI for csegraph's coding-agent context engine. Depends on csegraph-core, imported as csegraph_core."
requires-python = ">=3.10"
dependencies = ["csegraph-core>=1.3.0"]

[project.scripts]
csegraph = "csegraph_cli.main:main"

[tool.setuptools.packages.find]
include = ["csegraph_cli*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph-core"
version = "1.2.1"
description = "Storage, parsing, and retrieval primitives for the csegraph code-graph system."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.0.3"]

[tool.setuptools.packages.find]
include = ["csegraph_core*"]

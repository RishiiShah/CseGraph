[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph"
version = "1.3.1"
description = "SDK facade for csegraph's coding-agent context engine."
requires-python = ">=3.10"
dependencies = ["csegraph-core>=1.3.1"]

[project.optional-dependencies]
test = ["pytest>=9.0.3"]

[tool.setuptools.packages.find]
include = ["csegraph*"]

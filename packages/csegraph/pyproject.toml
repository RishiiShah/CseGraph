[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph"
version = "1.2.2"
description = "csegraph SDK facade with optional LLM-powered code generation."
requires-python = ">=3.10"
dependencies = ["csegraph-core>=1.2.2"]

[project.optional-dependencies]
test = ["pytest>=9.0.3"]

[tool.setuptools.packages.find]
include = ["csegraph*"]

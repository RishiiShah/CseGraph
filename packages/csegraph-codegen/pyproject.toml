[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csegraph-codegen"
version = "1.2.5"
description = "Optional LLM-powered code generation add-on for csegraph."
requires-python = ">=3.10"
dependencies = ["csegraph-core>=1.2.5"]

[project.optional-dependencies]
test = ["pytest>=9.0.3"]

[tool.setuptools.packages.find]
include = ["csegraph_codegen*"]

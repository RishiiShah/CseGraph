<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>csegraph - __CSEGRAPH_REPO_NAME__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.15);
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #080c14; /* legacy light bg reference: background: #f8fafc */
  color: #cbd5e1; /* legacy text color reference: color: #334155 */

  height: 100vh;
  display: flex;
  flex-direction: column;
}
#header {
  background: rgba(13, 18, 30, 0.7);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;

}
#logo-section {
  display: flex;
  align-items: center;
  gap: 12px;
}
#header h1 {
  font-family: 'Outfit', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #f8fafc;
  background: linear-gradient(135deg, #60a5fa, #3b82f6);

  -webkit-text-fill-color: transparent;
}
#repo-pill {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: #60a5fa;
  background: rgba(59, 130, 246, 0.08);
  border: 1px solid rgba(59, 130, 246, 0.15);

}
#stats {

}
#tab-bar-container {

}
#tab-bar {
  display: flex;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 9999px;
  padding: 3px;
}
.tab-btn {
  padding: 6px 16px;
  background: none;
  border: none;
  color: #94a3b8;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  font-size: 13px;

}
.tab-btn:hover {

}

}
#content-area {
  flex: 1;

}
.pane {

}
.pane.active {

}
#explorer-pane {

}
#sidebar {

#search-box {

}
#search-wrapper {

}
#search-icon {

}
#search {

}
#explorer-tree {

}
.folder-item {

}
.folder-header {

}
.folder-header:hover {

}
.folder-icon {

.file-item {

#explorer-main {

#details-sidebar {

}
#graph-pane {

canvas {

.detail-header h3 {

.controls-title {

.toggle-control {

}
.toggle-label {

}
.slider-control {

}

.slider-header {

.slider-control input[type="range"] {

.badge {

.badge-method { background: rgba(139, 92, 246, 0.12); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.2); }
.badge-test { background: rgba(244, 63, 94, 0.12); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.2); }
.badge-file { background: rgba(20, 184, 166, 0.12); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.2); }

.card {
  background: rgba(30, 41, 59, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  padding: 20px;
  backdrop-filter: blur(8px);
}
.card-title {
  font-family: 'Outfit', sans-serif;
  font-size: 16px;
  font-weight: 600;

}
.stats-grid {

}
.stat-card {

  margin-bottom: 4px;
}
.stat-lbl {
  font-size: 10px;
  color: #64748b;
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.detail-section-title {
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: #64748b;
  text-transform: uppercase;
  margin-bottom: 10px;
  letter-spacing: 0.05em;
}
.item-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list-link {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12.5px;
  color: #94a3b8;
  cursor: pointer;
  transition: all 0.15s;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.04);
}
.list-link:hover {
  background: rgba(255, 255, 255, 0.04);
  border-color: rgba(59, 130, 246, 0.2);

}
.list-link-name {

#search-results {

  flex: 1;
  overflow-y: auto;
  flex-direction: column;
  gap: 6px;

</head>
<body>
<div id="header">
  <div id="logo-section">
    <h1>csegraph</h1>
    <span id="repo-pill">__CSEGRAPH_REPO_NAME__</span>
  </div>
  <div id="tab-bar-container">
    <div id="tab-bar">
      <button id="tab-explorer" class="tab-btn active">Code Explorer</button>
      <button id="tab-graph" class="tab-btn">Visual Graph</button>
    </div>
  </div>
  <span id="stats"></span>
</div>
<div id="content-area">
  <!-- Code Explorer Pane -->
  <div id="explorer-pane" class="pane active">
    <div id="sidebar">
      <div id="search-box">
        <div id="search-wrapper">
          <span id="search-icon">🔍</span>
          <input id="search" type="text" placeholder="Search files, symbols, paths...">
        </div>
      </div>
      <div id="explorer-tree"></div>
      <div id="search-results"></div>
    </div>
    <div id="explorer-main"></div>
    <div id="details-sidebar"></div>
  </div>
  
  <!-- Visual Graph Pane -->
  <div id="graph-pane" class="pane" data-csegraph-viewer="interactive-force-graph">
    <canvas id="graph"></canvas>
    <div id="detail"></div>
    
    <!-- Floating Glass Controls Overlay -->
    <div id="graph-controls">
      <div class="controls-section">
        <h4 class="controls-title">Navigation</h4>
        <div class="btn-group">
          <button id="btn-zoom-in" title="Zoom In">＋ Zoom In</button>
          <button id="btn-zoom-out" title="Zoom Out">－ Zoom Out</button>
          <button id="btn-zoom-reset" title="Reset View">⟲ Reset</button>
          <button id="btn-play-pause" title="Pause Physics">⏸ Pause</button>
        </div>
      </div>

      <div class="controls-section">
        <h4 class="controls-title">Legend</h4>
        <div class="legend-grid">
          <span class="legend-item"><span class="dot file"></span> File</span>
          <span class="legend-item"><span class="dot class"></span> Class</span>
          <span class="legend-item"><span class="dot function"></span> Function</span>
          <span class="legend-item"><span class="dot method"></span> Method</span>
          <span class="legend-item"><span class="dot test"></span> Test</span>
        </div>
      </div>

      <div class="controls-section">
        <h4 class="controls-title">Options</h4>
        <label class="toggle-control">
          <input type="checkbox" id="chk-grid" checked>
          <span class="toggle-label">Show Background Grid</span>
        </label>
        <label class="toggle-control">
          <input type="checkbox" id="chk-labels" checked>
          <span class="toggle-label">Show Node Labels</span>
        </label>
        <label class="toggle-control">
          <input type="checkbox" id="chk-isolate" checked>
          <span class="toggle-label">Isolate Focused Node</span>
        </label>
      </div>

      <div class="controls-section">
        <h4 class="controls-title">Physics Engine</h4>
        <div class="slider-control">
          <div class="slider-header">
            <span>Repulsion</span>
            <span id="val-repulsion">2600</span>
          </div>
          <input type="range" id="sld-repulsion" min="500" max="8000" step="100" value="2600">
        </div>
        <div class="slider-control">
          <div class="slider-header">
            <span>Spring Length</span>
            <span id="val-spring-len">180</span>
          </div>
          <input type="range" id="sld-spring-len" min="50" max="400" step="10" value="180">
        </div>
        <div class="slider-control">
          <div class="slider-header">
            <span>Damping</span>
            <span id="val-damping">0.88</span>
          </div>
          <input type="range" id="sld-damping" min="0.5" max="0.99" step="0.01" value="0.88">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var DATA = __CSEGRAPH_DATA_JSON__;
  var nodes = DATA.nodes, edges = DATA.edges;
  var canvas = document.getElementById("graph");
  var ctx = canvas.getContext("2d");
  var searchInput = document.getElementById("search");
  var detail = document.getElementById("detail");
  var W = 0, H = 0, dpr = 1;
  var INITIAL_SPREAD_X = Math.max(1400, W * 2.4);
  var INITIAL_SPREAD_Y = Math.max(900, H * 2.0);
  var INITIAL_ZOOM = 0.45;
  var camX = 0, camY = 0, camZ = INITIAL_ZOOM;
  var idxById = {};
  var hoveredIndex = -1;

  function _hexToRgba(hex, alpha) {
    if (!hex) return "rgba(0,0,0," + alpha + ")";
    if (hex.startsWith('rgba')) {
      return hex.replace(/[\d\.]+\)$/, alpha + ")");
    }
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + ", " + g + ", " + b + ", " + alpha + ")";
  }

  var NODE_COLORS = {
    file: "#14b8a6",       // Teal
    class: "#3b82f6",      // Blue
    'function': "#10b981",  // Emerald
    method: "#8b5cf6",     // Violet
    test: "#f43f5e",       // Rose
    folder: "#0ea5e9",     // Sky
    repo: "#64748b"        // Slate
  };

  function getNodeColor(n) {
    return NODE_COLORS[n.kind] || "#64748b";
  }

  function getNodeRadius(n) {
    if (n.kind === 'file') return 8;
    if (n.kind === 'class') return 6.5;
    if (n.kind === 'test') return 5;
    if (n.kind === 'function' || n.kind === 'method') return 5;
    return 6;
  }
  var sim = [];
  var edgePairs = [];
  var searchVal = "";
  var expanded = {};
  var childrenById = {};
  var parentById = {};
  var visibleMap = {};
  var visibleNodeIds = [];
  var activeEdges = [];
  var visibilityDirty = true;
  var selectedIndex = -1;
  var dragNodeIndex = -1;
  var isPanning = false;
  var panStart = null;
  var didMove = false;
  var renderPending = false;
  var simTicks = 240;
  var MIN_ZOOM = 0.08, MAX_ZOOM = 3;
  var REPULSION = 2600, SPRING = 0.003, SPRING_LEN = 180, DAMPING = 0.88, CENTER = 0.00035;

  document.getElementById("stats").textContent = nodes.length + " nodes, " + edges.length + " edges";
  
  // Explorer Index Structures
  var folders = {}; 
  var incomingEdges = {}; 
  var outgoingEdges = {}; 

  nodes.forEach(function(n, i) {
    idxById[n.id] = i;
    if (!n.search_text) n.search_text = [n.name, n.path, n.id].filter(Boolean).join(" ").toLowerCase();
    sim.push({ x: (Math.random() - 0.5) * INITIAL_SPREAD_X, y: (Math.random() - 0.5) * INITIAL_SPREAD_Y, vx: 0, vy: 0, pinned: false });
    if (!n.parent_id) expanded[n.id] = true;
    
    // Group files by folder
    if (n.kind === 'file') {
      var slash = n.path.lastIndexOf('/');
      var dir = slash >= 0 ? n.path.substring(0, slash) : '(root)';
      if (!folders[dir]) folders[dir] = [];
      folders[dir].push(n);
    }
  });

  nodes.forEach(function(n) {
    if (n.parent_id && idxById[n.parent_id] !== undefined) {
      parentById[n.id] = n.parent_id;
      if (!childrenById[n.parent_id]) childrenById[n.parent_id] = [];
      childrenById[n.parent_id].push(n.id);
    }
  });

  edges.forEach(function(e) {
    var si = idxById[e.source], ti = idxById[e.target];
    if (si === undefined || ti === undefined) return;
    var pair = { source: si, target: ti, relation: e.relation };
    edgePairs.push(pair);
    
    if (!incomingEdges[e.target]) incomingEdges[e.target] = [];
    incomingEdges[e.target].push(pair);
    if (!outgoingEdges[e.source]) outgoingEdges[e.source] = [];
    outgoingEdges[e.source].push(pair);
  });

  // Tab navigation
  document.getElementById("tab-explorer").addEventListener("click", function() {

  function resize() {
    var rect = canvas.parentElement.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = rect.width; H = rect.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function toScreen(x, y) { return [(x - camX) * camZ + W / 2, (y - camY) * camZ + H / 2]; }
  function toWorld(x, y) { return [(x - W / 2) / camZ + camX, (y - H / 2) / camZ + camY]; }
  function matchesSearch(n) {
    if (!searchVal) return true;
    return n.search_text.indexOf(searchVal) >= 0;
  }
  function hasChildren(id) { return !!(childrenById[id] && childrenById[id].length); }
  function ancestorsExpanded(n) {
    var parent = parentById[n.id];
    while (parent) {
      if (!expanded[parent]) return false;
      parent = parentById[parent];
    }
    return true;
  }
  function markVisible(id) {
    while (id && !visibleMap[id]) {
      visibleMap[id] = true;
      id = parentById[id];
    }
  }
  function rebuildVisibleState() {
    visibleMap = {};
    visibleNodeIds = [];
    activeEdges = [];

    var isolateEnabled = document.getElementById("chk-isolate").checked;
    if (isolateEnabled && selectedIndex >= 0) {
      var selNode = nodes[selectedIndex];
      
      // 1. Mark selected node visible
      visibleMap[selNode.id] = true;
      
      // 2. Mark parent visible (1 level up)
      var parentId = parentById[selNode.id] || selNode.parent_id;
      if (parentId) {
        visibleMap[parentId] = true;
      }
      
      // 3. Mark children visible (1 level below)
      var children = childrenById[selNode.id] || [];
      children.forEach(function(cid) {
        visibleMap[cid] = true;
      });
      
      // 4. Mark connected nodes visible (direct relationships)
      var incoming = incomingEdges[selNode.id] || [];
      incoming.forEach(function(edge) {
        var srcNode = nodes[edge.source];
        if (srcNode) visibleMap[srcNode.id] = true;
      });
      var outgoing = outgoingEdges[selNode.id] || [];
      outgoing.forEach(function(edge) {
        var tgtNode = nodes[edge.target];
        if (tgtNode) visibleMap[tgtNode.id] = true;
      });
    } else {
      nodes.forEach(function(n) {
        if (searchVal) {
          if (matchesSearch(n)) markVisible(n.id);
        } else if (!n.parent_id || ancestorsExpanded(n)) {
          visibleMap[n.id] = true;
        }
      });
    }

    nodes.forEach(function(n) {
      if (visibleMap[n.id]) visibleNodeIds.push(n.id);
    });
    for (var ei = 0; ei < edgePairs.length; ei++) {
      var e = edgePairs[ei];
      if (visibleMap[nodes[e.source].id] && visibleMap[nodes[e.target].id]) activeEdges.push(e);
    }
    visibilityDirty = false;
  }
  function visibleNodeSet() {
    if (visibilityDirty) rebuildVisibleState();
    return visibleMap;
  }
  function toggleExpanded(i) {
    var id = nodes[i].id;
    if (!hasChildren(id)) return;
    expanded[id] = !expanded[id];
    visibilityDirty = true;
  }
  function findNode(mx, my) {
    var visible = visibleNodeSet();
    for (var v = visibleNodeIds.length - 1; v >= 0; v--) {
      var i = idxById[visibleNodeIds[v]];
      if (!visible[nodes[i].id]) continue;
      var sp = toScreen(sim[i].x, sim[i].y);
      var dx = sp[0] - mx, dy = sp[1] - my;
      if (dx * dx + dy * dy < 100) return i;
    }
    return -1;
  }
  function stepSim() {
    visibleNodeSet();
    var forceX = new Array(nodes.length);
    var forceY = new Array(nodes.length);

    // Spring forces (edges)
    for (var ei = 0; ei < activeEdges.length; ei++) {
      var e = activeEdges[ei];
      var a = sim[e.source], b = sim[e.target];
      var dx = b.x - a.x, dy = b.y - a.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      var force = SPRING * (dist - SPRING_LEN);
      var fxEdge = force * dx / dist, fyEdge = force * dy / dist;
      forceX[e.source] = (forceX[e.source] || 0) + fxEdge;
      forceY[e.source] = (forceY[e.source] || 0) + fyEdge;
      forceX[e.target] = (forceX[e.target] || 0) - fxEdge;
      forceY[e.target] = (forceY[e.target] || 0) - fyEdge;
    }

    // Repulsion forces (N-body)
    if (visibleNodeIds.length < 600) {
      for (var vi = 0; vi < visibleNodeIds.length; vi++) {
        var i = idxById[visibleNodeIds[vi]];
        var a = sim[i];
        for (var vj = vi + 1; vj < visibleNodeIds.length; vj++) {
          var j = idxById[visibleNodeIds[vj]];
          var b = sim[j];
          var dx = b.x - a.x;
          var dy = b.y - a.y;
          var distSq = dx * dx + dy * dy;
          if (distSq < 1) distSq = 1;
          if (distSq > 90000) continue; // limit distance of repulsion
          var dist = Math.sqrt(distSq);
          var force = -REPULSION / distSq;
          var fxRep = force * dx / dist;
          var fyRep = force * dy / dist;
          forceX[i] = (forceX[i] || 0) + fxRep;
          forceY[i] = (forceY[i] || 0) + fyRep;
          forceX[j] = (forceX[j] || 0) - fxRep;
          forceY[j] = (forceY[j] || 0) - fyRep;
        }
      }
    }

    // Centering and velocity updates
    for (var vi = 0; vi < visibleNodeIds.length; vi++) {
      var i = idxById[visibleNodeIds[vi]];
      if (sim[i].pinned) { sim[i].vx = 0; sim[i].vy = 0; continue; }
      var fx = forceX[i] || 0, fy = forceY[i] || 0;
      fx += (0 - sim[i].x) * CENTER;
      fy += (0 - sim[i].y) * CENTER;
      sim[i].vx = (sim[i].vx + fx) * DAMPING;
      sim[i].vy = (sim[i].vy + fy) * DAMPING;
      sim[i].x += sim[i].vx;
      sim[i].y += sim[i].vy;
    }
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    visibleNodeSet();

    // 1. Draw Grid Background (if checked)
    var showGridEnabled = document.getElementById("chk-grid").checked;
    if (showGridEnabled) {
      var gridSpacing = 100;
      if (camZ < 0.2) gridSpacing = 500;
      else if (camZ < 0.5) gridSpacing = 200;
      else if (camZ > 1.5) gridSpacing = 50;

      var leftWorld = toWorld(0, 0)[0];
      var rightWorld = toWorld(W, 0)[0];
      var topWorld = toWorld(0, 0)[1];
      var bottomWorld = toWorld(0, H)[1];

      ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
      ctx.lineWidth = 1;

      // Draw vertical lines
      var startX = Math.floor(leftWorld / gridSpacing) * gridSpacing;
      for (var x = startX; x <= rightWorld; x += gridSpacing) {
        var sx = toScreen(x, 0)[0];
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx, H);
        ctx.stroke();
      }

      // Draw horizontal lines
      var startY = Math.floor(topWorld / gridSpacing) * gridSpacing;
      for (var y = startY; y <= bottomWorld; y += gridSpacing) {
        var sy = toScreen(0, y)[1];
        ctx.beginPath();
        ctx.moveTo(0, sy);
        ctx.lineTo(W, sy);
        ctx.stroke();
      }
    }

    // Determine focus state
    var focusIndex = (selectedIndex >= 0) ? selectedIndex : hoveredIndex;
    var neighbors = new Set();
    if (focusIndex >= 0) {
      neighbors.add(focusIndex);
      for (var ei = 0; ei < activeEdges.length; ei++) {
        var e = activeEdges[ei];
        if (e.source === focusIndex) {
          neighbors.add(e.target);
        } else if (e.target === focusIndex) {
          neighbors.add(e.source);
        }
      }
    }

    // 2. Draw Edges
    for (var ei = 0; ei < activeEdges.length; ei++) {
      var e = activeEdges[ei];
      var isEdgeFocused = (focusIndex < 0) || (e.source === focusIndex || e.target === focusIndex);
      var opacity = isEdgeFocused ? 0.7 : 0.12;

      var color = "#64748b"; // fallback
      var isDashed = false;
      if (e.relation === "contains" || e.relation === "imports") {
        color = "#475569";
        isDashed = true;
      } else if (e.relation === "calls") {
        color = "#60a5fa";
      } else if (e.relation === "tested_by") {
        color = "#f43f5e";
        isDashed = true;
      }

      ctx.strokeStyle = _hexToRgba(color, opacity);
      ctx.lineWidth = isEdgeFocused ? Math.max(1.0, camZ * 1.5) : Math.max(0.5, camZ * 0.7);

      if (isDashed) {
        ctx.setLineDash([4, 4]);
      } else {
        ctx.setLineDash([]);
      }

      var a = toScreen(sim[e.source].x, sim[e.source].y);
      var b = toScreen(sim[e.target].x, sim[e.target].y);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }
    ctx.setLineDash([]); // Reset

    // 3. Draw Node Halos (Glowing Concentric Rings)
    for (var vi = 0; vi < visibleNodeIds.length; vi++) {
      var i = idxById[visibleNodeIds[vi]];
      var n = nodes[i];
      if (i === selectedIndex || i === hoveredIndex) {
        var p = toScreen(sim[i].x, sim[i].y);
        var baseColor = getNodeColor(n);
        var r = getNodeRadius(n);

        // Outer glow circle
        ctx.beginPath();
        ctx.arc(p[0], p[1], r + 6, 0, Math.PI * 2);
        ctx.fillStyle = _hexToRgba(baseColor, i === selectedIndex ? 0.18 : 0.1);
        ctx.fill();

        // Concentric outer ring
        ctx.beginPath();
        ctx.arc(p[0], p[1], r + 11, 0, Math.PI * 2);
        ctx.strokeStyle = _hexToRgba(baseColor, i === selectedIndex ? 0.35 : 0.2);
        ctx.lineWidth = 1.2;
        if (i === hoveredIndex && i !== selectedIndex) {
          ctx.setLineDash([2, 2]);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // 4. Draw Nodes
    var showLabelsEnabled = document.getElementById("chk-labels").checked;
    var showLabels = showLabelsEnabled && (searchVal || camZ > 0.35 || visibleNodeIds.length < 350);
    for (var vi = 0; vi < visibleNodeIds.length; vi++) {
      var i = idxById[visibleNodeIds[vi]];
      var n = nodes[i];
      var p = toScreen(sim[i].x, sim[i].y);
      var baseColor = getNodeColor(n);
      var r = getNodeRadius(n);

      var matched = searchVal && matchesSearch(n);
      if (matched) {
        baseColor = "#ef4444"; // Highlight search match
      }

      var isNodeFocused = (focusIndex < 0) || neighbors.has(i);
      var opacity = isNodeFocused ? 1.0 : 0.15;

      ctx.beginPath();
      ctx.arc(p[0], p[1], i === selectedIndex ? r + 1.5 : r, 0, Math.PI * 2);
      ctx.fillStyle = _hexToRgba(baseColor, opacity);
      ctx.fill();

      // Border for selected / hovered node
      if (i === selectedIndex) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (i === hoveredIndex) {
        ctx.strokeStyle = _hexToRgba("#ffffff", 0.8);
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // 5. Draw Labels
      if (showLabels && (visibleNodeIds.length < 900 || matched || i === selectedIndex || i === hoveredIndex)) {
        var labelOpacity = isNodeFocused ? 0.9 : 0.12;
        ctx.fillStyle = _hexToRgba("#cbd5e1", labelOpacity);
        if (i === selectedIndex || matched) {
          ctx.fillStyle = _hexToRgba("#f8fafc", labelOpacity);
          ctx.font = "bold 11px system-ui, -apple-system, sans-serif";
        } else {
          ctx.font = "11px system-ui, -apple-system, sans-serif";
        }
        ctx.fillText(n.name || n.id, p[0] + r + 4, p[1] + 3);
      }
    }
  }
  function scheduleRender() {
    if (renderPending) return;
    renderPending = true;
    requestAnimationFrame(function() {
      renderPending = false;
      draw();
    });
  }
  function resetSim() { simTicks = Math.max(simTicks, 80); scheduleRender(); }
  function addDetailLine(label, value) {
    if (!value) return;
    var row = document.createElement("div");
    row.className = "detail-row";
    var labelEl = document.createElement("strong");
    labelEl.textContent = label;
    var valEl = document.createElement("span");
    valEl.textContent = value;
    row.appendChild(labelEl);
    row.appendChild(valEl);
    detail.appendChild(row);
  }
  
  function showDetail(i) {
    var oldSelectedIndex = selectedIndex;
    selectedIndex = i;
    detail.textContent = "";

    var isolateEnabled = document.getElementById("chk-isolate").checked;
    if (isolateEnabled && i !== oldSelectedIndex) {
      visibilityDirty = true;

    }

    if (i < 0) { detail.style.display = "none"; scheduleRender(); return; }
    var n = nodes[i];

  }

  function selectNode(i) {

      return;

    selectedIndex = i;
    
    document.querySelectorAll(".file-item").forEach(function(el) {
      el.classList.remove("active");
    });
    var treeEl = document.getElementById("tree-node-" + i);
    if (treeEl) {
      treeEl.classList.add("active");
      var parentFolder = treeEl.parentElement;
      if (parentFolder && !parentFolder.classList.contains("show")) {
        parentFolder.classList.add("show");
        var headerIcon = parentFolder.previousElementSibling.querySelector(".folder-icon");
        if (headerIcon) headerIcon.innerHTML = "▼";
      }
    }
    
    showDetail(i);
    renderExplorerMain(i);
    renderSelectionDetails(i);

      addSymbolSection("Classes", classes, "badge-class");

      // Callers / Callees lists
      var incoming = incomingEdges[n.id] || [];
      var outgoing = outgoingEdges[n.id] || [];
      
      var callers = [], callees = [], testedBy = [], tests = [];
      incoming.forEach(function(e) {
        var sIdx = idxById[nodes[e.source].id];
        if (sIdx !== undefined) {
          var src = nodes[sIdx];

      });
      
      outgoing.forEach(function(e) {

          var tgt = nodes[tIdx];

      addSymbolSection("Incoming Calls (Callers)", callers, "badge-function");
      addSymbolSection("Outgoing Calls (Callees)", callees, "badge-function");
      addSymbolSection("Tested By", testedBy, "badge-test");

    card.className = "card";
    
    var title = document.createElement("div");
    title.className = "card-title";
    title.textContent = "Selection Details";
    card.appendChild(title);
    
    function addLine(lbl, val) {
      if (!val) return;
      var p = document.createElement("p");
      p.style.fontSize = "13px";
      p.style.marginBottom = "8px";
      p.style.lineHeight = "1.4";
      
      var strong = document.createElement("strong");
      strong.textContent = lbl + ": ";
      p.appendChild(strong);
      p.appendChild(document.createTextNode(val));
      card.appendChild(p);
    }
    
    addLine("Name", n.name);
    addLine("Kind", n.kind);
    addLine("Path", n.path);
    if (n.line_range) addLine("Lines", n.line_range[0] + "-" + n.line_range[1]);
    
    detailsSidebar.appendChild(card);
    
    var actionsCard = document.createElement("div");
    actionsCard.className = "card";
    actionsCard.style.marginTop = "16px";
    
    var actTitle = document.createElement("div");
    actTitle.className = "card-title";
    actTitle.textContent = "Actions";
    actionsCard.appendChild(actTitle);
    
    var centerBtn = document.createElement("button");
    centerBtn.style.width = "100%";
    centerBtn.style.padding = "8px";
    centerBtn.style.background = "#3b82f6";
    centerBtn.style.border = "none";
    centerBtn.style.borderRadius = "4px";
    centerBtn.style.color = "#ffffff";
    centerBtn.style.fontWeight = "600";
    centerBtn.style.cursor = "pointer";
    centerBtn.textContent = "Highlight in Visual Graph";
    
    centerBtn.addEventListener("click", function() {
      document.getElementById("tab-graph").click();
      selectedIndex = i;
      camX = sim[i].x;
      camY = sim[i].y;
      camZ = 1.0; 
      resetSim();
    });
    
    actionsCard.appendChild(centerBtn);
    detailsSidebar.appendChild(actionsCard);
  }

  function showDashboard() {
    selectedIndex = -1;
    document.querySelectorAll(".file-item").forEach(function(el) {
      el.classList.remove("active");
    });
    
    var mainView = document.getElementById("explorer-main");
    mainView.innerHTML = "";
    
    var header = document.createElement("div");
    var title = document.createElement("h2");
    title.style.fontFamily = "'Outfit', sans-serif";
    title.style.fontSize = "22px";
    title.style.color = "#f8fafc";
    title.textContent = "Codebase Dashboard";
    header.appendChild(title);
    mainView.appendChild(header);
    
    var statsCard = document.createElement("div");
    statsCard.className = "card";
    
    var scTitle = document.createElement("div");
    scTitle.className = "card-title";
    scTitle.textContent = "Repository Overview";
    statsCard.appendChild(scTitle);
    
    var grid = document.createElement("div");
    grid.className = "stats-grid";
    
    var counts = { file: 0, class: 0, 'function': 0, 'method': 0, 'test': 0 };
    nodes.forEach(function(n) {
      if (counts[n.kind] !== undefined) counts[n.kind]++;
    });
    
    function addStat(val, label) {
      var item = document.createElement("div");
      item.className = "stat-card card";
      var v = document.createElement("div");
      v.className = "stat-val";
      v.textContent = String(val);
      var l = document.createElement("div");
      l.className = "stat-lbl";
      l.textContent = label;
      item.appendChild(v);
      item.appendChild(l);
      grid.appendChild(item);
    }
    
    addStat(counts.file, "Files");
    addStat(counts.class, "Classes");
    addStat(counts['function'] + counts['method'], "Functions");
    addStat(counts.test, "Tests");
    addStat(edges.length, "Edges");
    
    statsCard.appendChild(grid);
    mainView.appendChild(statsCard);
    
    var degreeList = [];
    nodes.forEach(function(n, idx) {
      if (n.kind !== "file") {
        var deg = (incomingEdges[n.id] || []).length;
        degreeList.push({ node: n, index: idx, degree: deg });
      }
    });
    
    degreeList.sort(function(a, b) { return b.degree - a.degree; });
    var topDegree = degreeList.slice(0, 10);
    
    if (topDegree.length > 0) {
      var hotCard = document.createElement("div");
      hotCard.className = "card";
      
      var hcTitle = document.createElement("div");
      hcTitle.className = "card-title";
      hcTitle.textContent = "Top 10 Most-Referenced Symbols";
      hotCard.appendChild(hcTitle);
      
      var list = document.createElement("div");
      list.className = "item-list";
      
      topDegree.forEach(function(item) {
        var el = document.createElement("div");
        el.className = "list-link";
        
        var nameSpan = document.createElement("span");
        nameSpan.className = "list-link-name";
        nameSpan.textContent = item.node.name;
        
        var degSpan = document.createElement("span");
        degSpan.className = "list-link-sub";
        degSpan.textContent = item.degree + " incoming references";
        
        var badge = document.createElement("span");
        badge.className = "badge badge-" + item.node.kind;
        badge.textContent = item.node.kind;
        
        el.appendChild(nameSpan);
        el.appendChild(degSpan);
        el.appendChild(badge);
        
        el.addEventListener("click", function() {
          selectNode(item.index);
        });
        
        list.appendChild(el);
      });
      
      hotCard.appendChild(list);
      mainView.appendChild(hotCard);
    }
    
    var detailsSidebar = document.getElementById("details-sidebar");
    detailsSidebar.innerHTML = "";
    var guide = document.createElement("div");
    guide.className = "card";
    var gt = document.createElement("div");
    gt.className = "card-title";
    gt.textContent = "Explorer Guide";
    guide.appendChild(gt);
    var gp = document.createElement("p");
    gp.style.fontSize = "13px";
    gp.style.color = "#94a3b8";
    gp.style.lineHeight = "1.4";
    gp.textContent = "Select a folder and file in the left sidebar directory explorer, or search for files/symbols using the search bar.";
    guide.appendChild(gp);
    detailsSidebar.appendChild(guide);
  }

  canvas.addEventListener("mousedown", function(e) {
    var rect = canvas.getBoundingClientRect();
    var hit = findNode(e.clientX - rect.left, e.clientY - rect.top);
    didMove = false;
    if (hit >= 0) {
      dragNodeIndex = hit;
      sim[hit].pinned = true;
      showDetail(hit);
      canvas.style.cursor = "grabbing";
      return;
    }
    isPanning = true;
    panStart = { x: e.clientX, y: e.clientY, camX: camX, camY: camY };
    showDetail(-1);
    canvas.style.cursor = "grabbing";
  });
  canvas.addEventListener("mousemove", function(e) {
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (dragNodeIndex >= 0) {
      var world = toWorld(mx, my);
      didMove = true;
      sim[dragNodeIndex].x = world[0];
      sim[dragNodeIndex].y = world[1];
      resetSim();
      return;
    }
    if (isPanning && panStart) {
      var dx = (e.clientX - panStart.x) / camZ;
      var dy = (e.clientY - panStart.y) / camZ;
      didMove = didMove || Math.abs(e.clientX - panStart.x) + Math.abs(e.clientY - panStart.y) > 2;
      camX = panStart.camX - dx;
      camY = panStart.camY - dy;
      scheduleRender();
      return;
    }
    var hit = findNode(mx, my);
    if (hit !== hoveredIndex) {
      hoveredIndex = hit;
      scheduleRender();
    }
    canvas.style.cursor = hit >= 0 ? "grab" : "move";
  });
  canvas.addEventListener("mouseup", function(e) {
    var rect = canvas.getBoundingClientRect();
    var hit = findNode(e.clientX - rect.left, e.clientY - rect.top);
    if (dragNodeIndex >= 0) {
      var released = dragNodeIndex;
      sim[released].pinned = false;
      dragNodeIndex = -1;
      if (!didMove && hit === released) {
        toggleExpanded(hit);
        resetSim();
      }
      showDetail(released);
    }
    isPanning = false;
    panStart = null;
    if (hit !== hoveredIndex) {
      hoveredIndex = hit;
      scheduleRender();
    }
    canvas.style.cursor = hit >= 0 ? "grab" : "move";
  });
  canvas.addEventListener("mouseleave", function() {
    if (dragNodeIndex >= 0) sim[dragNodeIndex].pinned = false;
    dragNodeIndex = -1;
    isPanning = false;
    panStart = null;
    if (hoveredIndex !== -1) {
      hoveredIndex = -1;
      scheduleRender();
    }
    canvas.style.cursor = "grab";
  });
  canvas.addEventListener("wheel", function(e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var before = toWorld(mx, my);
    var factor = Math.exp(-e.deltaY * 0.001);
    camZ = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camZ * factor));
    camX = before[0] - (mx - W / 2) / camZ;
    camY = before[1] - (my - H / 2) / camZ;
    scheduleRender();
  }, { passive: false });

  searchInput.addEventListener("input", function(e) {
    var next = e.target.value.toLowerCase().trim();
    if (next === searchVal) return;
    searchVal = next;
    
    var treeContainer = document.getElementById("explorer-tree");
    var resultsContainer = document.getElementById("search-results");
    
    if (!searchVal) {
      treeContainer.style.display = "block";
      resultsContainer.style.display = "none";
      showDashboard();
      visibilityDirty = true;
      resetSim();
      return;
    }
    
    treeContainer.style.display = "none";
    resultsContainer.style.display = "flex";
    resultsContainer.innerHTML = "";
    
    var matchedItems = [];
    nodes.forEach(function(n, idx) {
      if (n.search_text && n.search_text.indexOf(searchVal) >= 0) {
        matchedItems.push({ node: n, index: idx });
      }
    });
    
    matchedItems.sort(function(a, b) {
      if (a.node.kind === "file" && b.node.kind !== "file") return -1;
      if (a.node.kind !== "file" && b.node.kind === "file") return 1;
      return a.node.name.localeCompare(b.node.name);
    });
    
    var limit = Math.min(matchedItems.length, 50);
    if (limit === 0) {
      var noRes = document.createElement("div");
      noRes.style.color = "#64748b";
      noRes.style.fontSize = "13px";
      noRes.textContent = "No matching files or symbols found.";
      resultsContainer.appendChild(noRes);
    } else {
      for (var k = 0; k < limit; k++) {
        var item = matchedItems[k];
        var el = document.createElement("div");
        el.className = "list-link";
        
        var nameSpan = document.createElement("span");
        nameSpan.className = "list-link-name";
        nameSpan.textContent = item.node.name;
        
        var subSpan = document.createElement("span");
        subSpan.className = "list-link-sub";
        subSpan.textContent = item.node.path;
        subSpan.style.whiteSpace = "nowrap";
        subSpan.style.overflow = "hidden";
        subSpan.style.textOverflow = "ellipsis";
        subSpan.style.maxWidth = "160px";
        
        var badge = document.createElement("span");
        badge.className = "badge badge-" + item.node.kind;
        badge.textContent = item.node.kind;
        
        el.appendChild(nameSpan);
        el.appendChild(subSpan);
        el.appendChild(badge);
        
        (function(idx) {
          el.addEventListener("click", function() {
            selectNode(idx);
          });
        })(item.index);
        
        resultsContainer.appendChild(el);
      }
      if (matchedItems.length > 50) {
        var more = document.createElement("div");
        more.style.fontSize = "11px";
        more.style.color = "#64748b";
        more.style.textAlign = "center";
        more.textContent = "Showing first 50 of " + matchedItems.length + " matches";
        resultsContainer.appendChild(more);
      }
    }
    
    visibilityDirty = true;
    resetSim();
  });

  window.addEventListener("resize", function() { resize(); scheduleRender(); });
  resize();

  // Control overlay event listeners
  var simPaused = false;
  var btnPlayPause = document.getElementById("btn-play-pause");
  btnPlayPause.addEventListener("click", function() {
    simPaused = !simPaused;
    if (simPaused) {
      btnPlayPause.textContent = "▶ Resume";
      btnPlayPause.title = "Resume Physics";
    } else {
      btnPlayPause.textContent = "⏸ Pause";
      btnPlayPause.title = "Pause Physics";
      resetSim();
    }
  });

  document.getElementById("btn-zoom-in").addEventListener("click", function() {
    camZ = Math.min(MAX_ZOOM, camZ * 1.3);
    scheduleRender();
  });
  document.getElementById("btn-zoom-out").addEventListener("click", function() {
    camZ = Math.max(MIN_ZOOM, camZ / 1.3);
    scheduleRender();
  });
  document.getElementById("btn-zoom-reset").addEventListener("click", function() {
    camX = 0;
    camY = 0;
    camZ = INITIAL_ZOOM;
    resetSim();
  });

  document.getElementById("chk-grid").addEventListener("change", function() {
    scheduleRender();
  });
  document.getElementById("chk-labels").addEventListener("change", function() {
    scheduleRender();
  });
  document.getElementById("chk-isolate").addEventListener("change", function() {
    visibilityDirty = true;
    resetSim();
  });

  var sldRepulsion = document.getElementById("sld-repulsion");
  var valRepulsion = document.getElementById("val-repulsion");
  sldRepulsion.addEventListener("input", function(e) {
    REPULSION = parseFloat(e.target.value);
    valRepulsion.textContent = REPULSION;
    resetSim();
  });

  var sldSpringLen = document.getElementById("sld-spring-len");
  var valSpringLen = document.getElementById("val-spring-len");
  sldSpringLen.addEventListener("input", function(e) {
    SPRING_LEN = parseFloat(e.target.value);
    valSpringLen.textContent = SPRING_LEN;
    resetSim();
  });

  var sldDamping = document.getElementById("sld-damping");
  var valDamping = document.getElementById("val-damping");
  sldDamping.addEventListener("input", function(e) {
    DAMPING = parseFloat(e.target.value);
    valDamping.textContent = DAMPING.toFixed(2);
    resetSim();
  });

  function loop() {
    if (simTicks > 0 && !simPaused) {
      stepSim();
      simTicks--;
      draw();
    }
    requestAnimationFrame(loop);
  }

  rebuildVisibleState();
  renderExplorerTree();
  showDashboard();
  canvas.style.cursor = "grab";
  loop();
})();
</script>
</body>
</html>
